<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>CollinMotion</title>
  <meta name="description" content="Short films and photographs by Collin Butrlakorn, made between Alaska and Oregon.">
  <meta name="theme-color" content="#fbf3dc">
  <meta property="og:title" content="CollinMotion">
  <meta property="og:description" content="Short films and photographs by Collin Butrlakorn.">
  <meta property="og:image" content="media/reel-poster.jpg">
  <link rel="icon" href="assets/favicon.svg" type="image/svg+xml">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Nanum+Pen+Script&family=Schibsted+Grotesk:ital,wght@0,400;0,500;0,700;0,800;1,400&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="assets/css/style.css">
</head>
<body data-page="home" class="is-home">
  <a class="skip" href="#main">Skip to content</a>
  <div class="sunlight" aria-hidden="true"><i></i><i></i><i></i><i></i></div>

  <header class="site-header">
    <a class="mark" href="./">CollinMotion</a>
    <nav aria-label="Main">
      <ul>
        <li><a href="films.html">Films</a></li>
        <li><a href="photography.html">Photography</a></li>
        <li><a href="about.html">About</a></li>
      </ul>
    </nav>
  </header>

  <section class="hero" aria-label="Reel">
    <h1>CollinMotion</h1>
    <div class="reel">
      <div class="reel-fallback" aria-hidden="true"></div>
      <video muted loop playsinline autoplay preload="auto" aria-hidden="true"></video>
      <div class="reel-controls">
        <button id="reel-toggle" type="button">Pause reel</button>
      </div>
    </div>
    <p class="hand"></p>
  </section>

  <main id="main">
    <section class="section">
      <p class="statement" id="statement"></p>
    </section>

    <section class="section" aria-labelledby="films-h">
      <div class="section-head">
        <h2 id="films-h">Films</h2>
        <a href="films.html">All films</a>
      </div>
      <div class="films" id="films"></div>
    </section>

    <section class="section" aria-labelledby="photo-h">
      <div class="section-head">
        <h2 id="photo-h">Photography</h2>
        <a href="photography.html">All photography</a>
      </div>
      <div class="photo-strip" id="photo-strip"></div>
    </section>

    <section class="section" aria-labelledby="shorts-h">
      <div class="section-head">
        <h2 id="shorts-h">Shorts</h2>
        <a data-link="instagram" href="#">On Instagram</a>
      </div>
      <div class="shorts" id="shorts"></div>
    </section>
  </main>

  <footer class="site-footer">
    <p>© <span id="year"></span> Collin Butrlakorn</p>
    <ul>
      <li><a data-link="youtube" href="#">YouTube</a></li>
      <li><a data-link="instagram" href="#">Instagram</a></li>
      <li><a data-link="email" href="#">Email</a></li>
    </ul>
  </footer>

  <dialog id="player" aria-label="Film player">
    <div class="player-frame"></div>
    <div class="player-caption">
      <h3></h3>
      <button class="dialog-close" type="button">Close</button>
    </div>
  </dialog>

  <script src="assets/js/content.js"></script>
  <script src="assets/js/site.js"></script>
</body>
</html>
